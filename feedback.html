<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#ff6ec4,#7873f5 50%,#4ade80);min-height:100vh;color:#1a1033}
.wrap{max-width:520px;margin:auto;padding:20px}
.card{background:#fff;border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 10px 30px #0003;animation:pop .5s ease both}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}
h1{font-size:2rem;margin:.2em 0;color:#fff;text-shadow:0 3px 0 #0003}.sub{color:#fff;opacity:.95;margin:0}
.badge{display:inline-block;background:#ffe14d;padding:4px 12px;border-radius:99px;font-weight:700;font-size:.8rem;transform:rotate(-3deg)}
.socials{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.socials a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:16px;color:#fff;text-decoration:none;font-weight:700;font-size:.85rem;transition:transform .15s}
.socials a:active{transform:scale(.94)}.socials svg{width:28px;height:28px;fill:#fff}
.li{background:#0a66c2}.gh{background:#24292f}.ig{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)}
input,textarea{width:100%;padding:12px;border:2px solid #e3dcff;border-radius:14px;font:inherit;margin:6px 0}textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:#7873f5}
button{width:100%;padding:14px;border:0;border-radius:14px;background:#7873f5;color:#fff;font-weight:800;font-size:1rem}button:disabled{opacity:.5}
.meta{display:flex;justify-content:space-between;font-size:.8rem;color:#776}.msg{font-weight:700;margin-top:8px}
.doubt{border-left:5px solid #ff6ec4;padding:8px 12px;margin:10px 0;background:#faf7ff;border-radius:10px}.doubt b{font-size:.8rem;color:#7873f5}
footer{text-align:center;color:#fff;font-size:.8rem;opacity:.9}
</style></head><body><div class="wrap">

<div class="card"><h3 style="margin-top:0">💭 Post your doubt</h3>
<h2 style="margin-top:0">💬 How was the seminar?</h2>
<form id="f"><input id="n" maxlength="40" required minlength="2" placeholder="Your name (required)">
<div id="stars" style="font-size:2.4rem;cursor:pointer;margin:.6rem 0;user-select:none">☆☆☆☆☆</div>
<textarea id="t" maxlength="240" placeholder="What did you like? What should be better?"></textarea>
<button id="b">Send feedback 🙌</button><div class="msg" id="m"></div></form>
<p class="meta"><a href="index.html">← Back to doubts</a></p></div>
<script src="config.js"></script><script src="api.js"></script><script>
let r=0;const s=document.getElementById('stars');
const draw=()=>s.textContent='★'.repeat(r)+'☆'.repeat(5-r);
s.onclick=e=>{const w=s.getBoundingClientRect();r=Math.min(5,Math.max(1,Math.ceil((e.clientX-w.left)/(w.width/5))));draw();};
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('m');
if(!r){m.textContent='Tap a star rating first ⭐';return;}
const name=document.getElementById('n').value.trim().slice(0,40),c=document.getElementById('t').value.trim();
try{await API.submit(name,`[Feedback ${'⭐'.repeat(r)}] ${c||'(no comment)'}`);m.textContent='Thank you! 💛';e.target.reset();r=0;draw();}
catch(x){m.textContent='Could not send, try again.';}};
</script></body></html>
